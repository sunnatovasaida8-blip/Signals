<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MAX STAVKA - BE127 VIP SIGNALS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #041208 linear-gradient(180deg, #020a04 0%, #0a2613 50%, #030e06 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* HEADER & ID SECTION */
    .header-card {
      width: 100%; max-width: 420px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(52, 199, 89, 0.3);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; }
    
    .promo-badge {
      background: #34c759; color: #000; font-weight: 800; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: 0.2s; user-select: none;
    }
    .promo-badge:active { transform: scale(0.95); background: #2cb04d; }

    .id-box { display: flex; gap: 6px; width: 100%; }
    .id-input {
      flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(52, 199, 89, 0.4);
      border-radius: 8px; color: #fff; padding: 8px 12px; font-size: 13px; outline: none; text-align: center;
    }
    .btn-connect {
      background: #34c759; color: #000; font-weight: bold; border: none;
      border-radius: 8px; padding: 0 14px; font-size: 12px; cursor: pointer;
    }

    .status-text { font-size: 11px; color: #34c759; text-align: center; display: none; font-weight: 600; }

    /* NAVIGATION TABS */
    .game-tabs { display: flex; gap: 6px; width: 100%; max-width: 420px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1; padding: 8px 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #aaa; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer;
    }
    .tab-btn.active { background: rgba(52, 199, 89, 0.2); border-color: #34c759; color: #fff; font-weight: bold; }

    /* GAME CONTAINERS */
    .game-view { width: 100%; max-width: 420px; display: none; flex-direction: column; align-items: center; }
    .game-view.active { display: flex; }

    /* APPLE OF FORTUNE BOARD */
    .board-container {
      width: 100%; display: flex; flex-direction: column; gap: 5px;
      background: radial-gradient(circle, rgba(18, 56, 31, 0.9) 0%, rgba(3, 15, 7, 0.95) 100%);
      padding: 10px 8px; border-radius: 16px; border: 1px solid rgba(52, 199, 89, 0.3);
    }

    .apple-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px; }

    .coeff-badge {
      min-width: 62px; height: 26px; background: #1a291e; border: 1px solid #2d4533; border-radius: 6px;
      display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: 800; color: #8ea895;
    }
    .coeff-badge.active {
      background: linear-gradient(135deg, #34c759, #28a745); color: #000;
      border-color: #5cdb7d; box-shadow: 0 0 10px rgba(52, 199, 89, 0.8);
    }

    .cells-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex-grow: 1; }

    .wooden-cell {
      aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, #8b5a2b 0%, #4a2e11 80%, #2d1a08 100%);
      border: 2px solid #a66d3b; display: flex; justify-content: center; align-items: center; font-size: 20px;
    }
    .wooden-cell.apple {
      background: radial-gradient(circle, #248a3d 0%, #0b3e17 100%); border-color: #34c759; box-shadow: 0 0 12px #34c759;
    }
    .wooden-cell.eaten {
      background: radial-gradient(circle, #8b0000 0%, #4a0000 100%); border-color: #ff3b30; opacity: 0.7;
    }

    /* SWAMP LAND BOARD (4x5) */
    .swamp-board {
      display: grid; grid-template-rows: repeat(4, 1fr); gap: 8px; width: 100%;
      background: #081d11; padding: 12px; border-radius: 16px; border: 1px solid #34c759;
    }
    .swamp-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .swamp-cell {
      aspect-ratio: 1; background: #143320; border: 1px solid #225435; border-radius: 10px;
      display: flex; justify-content: center; align-items: center; font-size: 22px;
    }
    .swamp-cell.safe { background: #1e5933; border-color: #34c759; box-shadow: 0 0 8px #34c759; }

    /* MINES BOARD (5x5) */
    .mines-board {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%;
      background: #0a1820; padding: 12px; border-radius: 16px; border: 1px solid #007aff;
    }
    .mine-cell {
      aspect-ratio: 1; background: #142836; border: 1px solid #20435c; border-radius: 10px;
      display: flex; justify-content: center; align-items: center; font-size: 22px;
    }
    .mine-cell.star { background: #007aff; border-color: #5ac8fa; box-shadow: 0 0 10px #007aff; }

    /* CONTROLS */
    .controls { width: 100%; max-width: 420px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }

    .btn-main {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #34c759, #1e7031);
      border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    }
    .btn-main:active { transform: scale(0.98); }

    .nav-btns { display: flex; gap: 8px; width: 100%; }
    .btn-sub {
      flex: 1; padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center; font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- HEADER & ID SECTION -->
  <div class="header-card">
    <div class="top-bar">
      <span>⚡️ MAX STAVKA SIGNALS</span>
      <div class="promo-badge" onclick="copyPromo()">PROMO: BE127</div>
    </div>
    <div class="id-box">
      <input type="number" id="userId" class="id-input" placeholder="Linebet ID kiriting">
      <button class="btn-connect" onclick="connectID()">ULANISH ⚡️</button>
    </div>
    <div id="statusText" class="status-text">✅ Account muvaffaqiyatli ulandi! Account aktiv.</div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="game-tabs">
    <div class="tab-btn active" onclick="switchGame('apple', event)">🍎 Apple</div>
    <div class="tab-btn" onclick="switchGame('swamp', event)">🐸 Swamp Land</div>
    <div class="tab-btn" onclick="switchGame('mines', event)">💣 Mines</div>
  </div>

  <!-- APPLE OF FORTUNE -->
  <div id="appleGame" class="game-view active">
    <div class="board-container" id="board"></div>
    <div class="controls">
      <button class="btn-main" onclick="generateAppleSignal()">🚀 START (SIGNAL OL)</button>
      <div class="nav-btns">
        <button class="btn-sub" onclick="prevAppleStep()">⬅️ OLDINGI QATOR</button>
        <button class="btn-sub" onclick="nextAppleStep()">KEYINGI QATOR ➡️</button>
      </div>
    </div>
  </div>

  <!-- SWAMP LAND -->
  <div id="swampGame" class="game-view">
    <div class="swamp-board" id="swampBoard"></div>
    <div class="controls">
      <button class="btn-main" onclick="generateSwampSignal()">🚀 SWAMP SIGNAL OL</button>
    </div>
  </div>

  <!-- MINES -->
  <div id="minesGame" class="game-view">
    <div class="mines-board" id="minesBoard"></div>
    <div class="controls">
      <button class="btn-main" style="background: linear-gradient(135deg, #007aff, #004080);" onclick="generateMinesSignal()">🚀 MINES SIGNAL OL</button>
    </div>
  </div>

  <script>
    // Copy Promo Code
    function copyPromo() {
      navigator.clipboard.writeText("BE127");
      alert("Promokod nusxalandi: BE127");
    }

    // Connect ID
    function connectID() {
      const val = document.getElementById('userId').value;
      if (val.length < 4) {
        alert("Iltimos, Linebet ID raqamingizni kiriting!");
        return;
      }
      document.getElementById('statusText').style.display = 'block';
    }

    // Tab Switcher
    function switchGame(game, e) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.game-view').forEach(g => g.classList.remove('active'));

      e.target.classList.add('active');
      document.getElementById(game + 'Game').classList.add('active');
    }

    /* --- APPLE OF FORTUNE LOGIC --- */
    const coeffs = ["x 349.68", "x 69.93", "x 27.97", "x 11.18", "x 6.71", "x 4.02", "x 2.41", "x 1.93", "x 1.54", "x 1.23"];
    const board = document.getElementById('board');
    let currentStep = 9;
    let safeAppleCols = [];

    function initAppleBoard() {
      board.innerHTML = '';
      for (let r = 0; r < 10; r++) {
        const row = document.createElement('div');
        row.className = 'apple-row';

        const badge = document.createElement('div');
        badge.className = 'coeff-badge' + (r === currentStep ? ' active' : '');
        badge.innerText = coeffs[r];
        badge.id = `badge-${r}`;
        row.appendChild(badge);

        const group = document.createElement('div');
        group.className = 'cells-group';

        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'wooden-cell';
          cell.id = `cell-${r}-${c}`;
          group.appendChild(cell);
        }

        row.appendChild(group);
        board.appendChild(row);
      }
    }

    function generateAppleSignal() {
      safeAppleCols = [];
      for (let r = 0; r < 10; r++) safeAppleCols.push(Math.floor(Math.random() * 5));
      currentStep = 9;
      renderApple();
    }

    function renderApple() {
      for (let r = 0; r < 10; r++) {
        document.getElementById(`badge-${r}`).className = 'coeff-badge' + (r === currentStep ? ' active' : '');
        for (let c = 0; c < 5; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.className = 'wooden-cell'; cell.innerHTML = '';
          if (r >= currentStep && safeAppleCols[r] !== undefined) {
            if (c === safeAppleCols[r]) { cell.classList.add('apple'); cell.innerHTML = '🍎'; }
            else if (r === currentStep) { cell.classList.add('eaten'); cell.innerHTML = '🍄'; }
          }
        }
      }
    }

    function nextAppleStep() { if (currentStep > 0) { currentStep--; renderApple(); } }
    function prevAppleStep() { if (currentStep < 9) { currentStep++; renderApple(); } }

    /* --- SWAMP LAND LOGIC (4x5) --- */
    const swampBoard = document.getElementById('swampBoard');
    function initSwampBoard() {
      swampBoard.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        const row = document.createElement('div');
        row.className = 'swamp-row';
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'swamp-cell';
          cell.id = `swamp-${r}-${c}`;
          cell.innerHTML = '🪷';
          row.appendChild(cell);
        }
        swampBoard.appendChild(row);
      }
    }

    function generateSwampSignal() {
      initSwampBoard();
      for (let r = 0; r < 4; r++) {
        const safeCol = Math.floor(Math.random() * 5);
        const cell = document.getElementById(`swamp-${r}-${safeCol}`);
        cell.classList.add('safe');
        cell.innerHTML = '🐸';
      }
    }

    /* --- MINES LOGIC (5x5) --- */
    const minesBoard = document.getElementById('minesBoard');
    function initMinesBoard() {
      minesBoard.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'mine-cell';
        cell.id = `mine-${i}`;
        cell.innerHTML = '🔹';
        minesBoard.appendChild(cell);
      }
    }

    function generateMinesSignal() {
      initMinesBoard();
      let stars = new Set();
      while(stars.size < 5) {
        stars.add(Math.floor(Math.random() * 25));
      }
      stars.forEach(idx => {
        const cell = document.getElementById(`mine-${idx}`);
        cell.classList.add('star');
        cell.innerHTML = '⭐';
      });
    }

    // Init All Games
    initAppleBoard();
    generateAppleSignal();
    initSwampBoard();
    initMinesBoard();
  </script>
</body>
</html>
