<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Apple of Fortune VIP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #092011 linear-gradient(180deg, #05140a 0%, #0c331a 50%, #051a0d 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    /* HEADER */
    .top-header {
      width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(0,0,0,0.4); border-radius: 12px; margin-bottom: 10px; font-size: 13px;
    }
    .promo-badge { background: #34c759; color: #000; font-weight: bold; padding: 3px 8px; border-radius: 6px; }

    /* GAME BOARD */
    .board-container {
      width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px;
      background: radial-gradient(circle, rgba(20,60,35,0.8) 0%, rgba(5,20,10,0.95) 100%);
      padding: 12px 8px; border-radius: 16px; border: 1px solid rgba(52, 199, 89, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;
    }

    .apple-row {
      display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 6px;
    }

    /* LEFT COEFF BADGE */
    .coeff-badge {
      min-width: 62px; height: 26px; background: #222d25; border: 1px solid #334437; border-radius: 6px;
      display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #8ea895;
    }
    .coeff-badge.active {
      background: linear-gradient(135deg, #34c759, #28a745); color: #000;
      border-color: #5cdb7d; box-shadow: 0 0 10px rgba(52, 199, 89, 0.6);
    }

    /* CELL GRID (5 COLS) */
    .cells-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex-grow: 1; }

    .wooden-cell {
      aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, #8b5a2b 0%, #4a2e11 80%, #2d1a08 100%);
      border: 2px solid #a66d3b; box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.5);
      display: flex; justify-content: center; align-items: center; font-size: 20px; transition: all 0.3s ease;
    }

    .wooden-cell.apple {
      background: radial-gradient(circle, #1e7e34 0%, #0b3e17 100%); border-color: #34c759;
      box-shadow: 0 0 12px #34c759;
    }

    .wooden-cell.eaten {
      background: radial-gradient(circle, #8b0000 0%, #4a0000 100%); border-color: #ff3b30;
      box-shadow: 0 0 12px #ff3b30;
    }

    /* CONTROLS */
    .controls { width: 100%; max-width: 420px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    
    .btn-main {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #34c759, #248a3d);
      border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4); cursor: pointer;
    }
    .btn-main:active { transform: scale(0.98); }

    .nav-btns { display: flex; gap: 8px; width: 100%; }
    .btn-sub {
      flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: center;
    }

    /* TROPICAL LEAVES DECORATION */
    .footer-leaves { margin-top: auto; font-size: 24px; opacity: 0.6; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="top-header">
    <span><b>APPLE OF FORTUNE</b> VIP</span>
    <span class="promo-badge">BE127</span>
  </div>

  <div class="board-container" id="board"></div>

  <div class="controls">
    <button class="btn-main" onclick="generateSignal()">🚀 SIGNAL OL (BOSHLASH)</button>
    <div class="nav-btns">
      <button class="btn-sub" onclick="prevStep()">⬅️ Oldingi</button>
      <button class="btn-sub" onclick="nextStep()">Keyingi ➡️</button>
    </div>
  </div>

  <div class="footer-leaves">🌿 🌴 🪷 🌴 🌿</div>

  <script>
    const coeffs = [
      "x 349.68", "x 69.93", "x 27.97", "x 11.18", 
      "x 6.71", "x 4.02", "x 2.41", "x 1.93", "x 1.54", "x 1.23"
    ];

    const board = document.getElementById('board');
    let currentStep = 9; // starts from bottom (x1.23)
    let safeCols = [];

    // Build 10 rows
    function initBoard() {
      board.innerHTML = '';
      for (let r = 0; r < 10; r++) {
        const row = document.createElement('div');
        row.className = 'apple-row';
        row.id = `row-${r}`;

        const badge = document.createElement('div');
        badge.className = 'coeff-badge' + (r === currentStep ? ' active' : '');
        badge.innerText = coeffs[r];
        badge.id = `badge-${r}`;
        row.appendChild(badge);

        const group = document.createElement('div');
        group.className = 'cells-group';

        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'wooden-cell';
          cell.id = `cell-${r}-${c}`;
          group.appendChild(cell);
        }

        row.appendChild(group);
        board.appendChild(row);
      }
    }

    function generateSignal() {
      safeCols = [];
      for (let r = 0; r < 10; r++) {
        safeCols.push(Math.floor(Math.random() * 5));
      }
      currentStep = 9;
      render();
    }

    function render() {
      for (let r = 0; r < 10; r++) {
        const badge = document.getElementById(`badge-${r}`);
        badge.className = 'coeff-badge' + (r === currentStep ? ' active' : '');

        for (let c = 0; c < 5; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.className = 'wooden-cell';
          cell.innerHTML = '';

          // Show safe apples up to current active step
          if (r >= currentStep && safeCols[r] !== undefined) {
            if (c === safeCols[r]) {
              cell.classList.add('apple');
              cell.innerHTML = '🍎';
            } else if (r === currentStep) {
              // Optionally show eaten apple on inactive cells of current row
              cell.classList.add('eaten');
              cell.innerHTML = '🍄';
            }
          }
        }
      }
    }

    function nextStep() {
      if (safeCols.length === 0) generateSignal();
      if (currentStep > 0) {
        currentStep--;
        render();
      }
    }

    function prevStep() {
      if (currentStep < 9) {
        currentStep++;
        render();
      }
    }

    initBoard();
    generateSignal();
  </script>
</body>
</html>
