<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BE127 VIP SIGNALS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #080c14; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }

    /* Top Promo Banner */
    .promo-banner { background: rgba(255, 170, 0, 0.12); border: 1px solid #ffaa00; border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.4; margin-bottom: 15px; width: 100%; max-width: 380px; box-shadow: 0 0 10px rgba(255, 170, 0, 0.15); }
    .promo-banner span { color: #ffaa00; font-weight: bold; }

    /* Tabs */
    .nav-tabs { display: flex; gap: 6px; width: 100%; max-width: 380px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 4px; background: #131b2e; border: 1px solid #233252; color: #8a9bbd; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: linear-gradient(180deg, #00e676, #00a854); color: #000; border-color: #00e676; box-shadow: 0 0 12px rgba(0, 230, 118, 0.4); }

    /* Game Card */
    .game-box { display: none; width: 100%; max-width: 380px; background: #0f172a; border-radius: 14px; padding: 15px; border: 2px solid #1e293b; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .game-box.active { display: block; }

    .game-header { background: linear-gradient(180deg, #1e3a8a, #0f172a); border: 1px solid #3b82f6; border-radius: 8px; padding: 8px; font-weight: bold; font-size: 16px; margin-bottom: 15px; letter-spacing: 1px; color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }

    /* Mines 5x5 Grid */
    .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
    .cell { aspect-ratio: 1; background: #1b263b; border: 1px solid #2e4066; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: 0.3s; }
    .cell.opened { background: #059669; border-color: #10b981; box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 10px rgba(16, 185, 129, 0.5); transform: scale(1.02); }

    /* Aviator Visual */
    .aviator-display { height: 180px; background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%); border: 1px solid #312e81; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .aviator-plane { font-size: 50px; transition: transform 0.5s ease; filter: drop-shadow(0 0 10px #f43f5e); }
    .aviator-coef { font-size: 28px; font-weight: bold; color: #f43f5e; margin-top: 10px; text-shadow: 0 0 10px rgba(244, 63, 94, 0.6); }

    /* Apple Rows & Multipliers */
    .apple-board { display: flex; gap: 8px; margin-bottom: 15px; }
    .apple-rows { flex: 1; display: flex; flex-direction: column-reverse; gap: 6px; }
    .apple-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .apple-mults { display: flex; flex-direction: column-reverse; gap: 6px; width: 60px; }
    .mult-item { height: 100%; display: flex; align-items: center; justify-content: center; background: #1e293b; border: 1px solid #334155; border-radius: 6px; font-size: 11px; font-weight: bold; color: #8a9bbd; transition: 0.3s; }
    .mult-item.active-mult { background: #15803d; color: #facc15; border-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

    /* Buttons Group */
    .btn-signal { width: 100%; padding: 13px; background: linear-gradient(180deg, #00e676, #00a854); border: none; border-radius: 10px; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,230,118,0.3); transition: 0.2s; }
    .btn-signal:active { transform: scale(0.97); }

    .apple-controls { display: flex; flex-direction: column; gap: 8px; }
    .step-btns { display: flex; gap: 8px; }
    .btn-step { flex: 1; padding: 10px; background: #1e293b; border: 1px solid #3b82f6; color: #38bdf8; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-step:disabled { opacity: 0.4; border-color: #334155; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="promo-banner">
    ⚠️ Signallar faqat <span>BE127</span> promokodi orqali ro'yxatdan o'tib, kamida <span>45 000 so'm</span> depozit qilingan ID raqamlarda 100% aniq ishlaydi!
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openGame('mines')">Mines 💎</button>
    <button class="tab-btn" onclick="openGame('aviator')">Aviator ✈</button>
    <button class="tab-btn" onclick="openGame('apple')">Apple 🍎</button>
  </div>

  <!-- MINES -->
  <div id="mines" class="game-box active">
    <div class="game-header">GEMS MINES (5x5)</div>
    <div class="mines-grid" id="minesGrid"></div>
    <button class="btn-signal" onclick="getMinesSignal()">SIGNAL OLISH 🚀</button>
  </div>

  <!-- AVIATOR -->
  <div id="aviator" class="game-box">
    <div class="game-header" style="background: linear-gradient(180deg, #881337, #0f172a); border-color: #f43f5e; color: #fb7185;">AVIATOR PRO</div>
    <div class="aviator-display">
      <div class="aviator-plane" id="planeIcon">✈️️</div>
      <div class="aviator-coef" id="coefText">x1.00</div>
    </div>
    <button class="btn-signal" onclick="getAviatorSignal()">SIGNAL OLISH 🚀</button>
  </div>

  <!-- APPLE OF FORTUNE -->
  <div id="apple" class="game-box">
    <div class="game-header" style="background: linear-gradient(180deg, #14532d, #0f172a); border-color: #22c55e; color: #4ade80;">APPLE OF FORTUNE</div>
    <div class="apple-board">
      <div class="apple-rows" id="appleRows"></div>
      <div class="apple-mults">
        <div class="mult-item" id="m-5">6.71x</div>
        <div class="mult-item" id="m-4">4.02x</div>
        <div class="mult-item" id="m-3">2.41x</div>
        <div class="mult-item" id="m-2">1.93x</div>
        <div class="mult-item" id="m-1">1.56x</div>
        <div class="mult-item" id="m-0">1.23x</div>
      </div>
    </div>

    <!-- CONTROL BUTTONS FOR APPLE -->
    <div class="apple-controls">
      <button class="btn-signal" onclick="startAppleGame()">START 🚀</button>
      <div class="step-btns">
        <button class="btn-step" id="prevBtn" onclick="stepApple(-1)" disabled>⬇️ OLDINGI</button>
        <button class="btn-step" id="nextBtn" onclick="stepApple(1)" disabled>KEYINGI ⬆️</button>
      </div>
    </div>
  </div>

  <script>
    function openGame(id) {
      document.querySelectorAll('.game-box').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }

    // Init Mines Grid
    const mGrid = document.getElementById('minesGrid');
    mGrid.innerHTML = '';
    for(let i=0; i<25; i++) mGrid.innerHTML += `<div class="cell" id="m-${i}"></div>`;

    // Init Apple Grid
    const aRows = document.getElementById('appleRows');
    aRows.innerHTML = '';
    for(let r=0; r<6; r++) {
      let rHtml = `<div class="apple-row">`;
      for(let c=0; c<5; c++) rHtml += `<div class="cell" id="ap-${r}-${c}"></div>`;
      rHtml += `</div>`;
      aRows.innerHTML += rHtml;
    }

    // Mines Signal
    function getMinesSignal() {
      document.querySelectorAll('#minesGrid .cell').forEach(c => { c.classList.remove('opened'); c.innerHTML = ''; });
      let arr = [];
      while(arr.length < 4) {
        let r = Math.floor(Math.random() * 25);
        if(!arr.includes(r)) arr.push(r);
      }
      arr.forEach(i => {
        let el = document.getElementById(`m-${i}`);
        el.classList.add('opened');
        el.innerHTML = '💎';
      });
    }

    // Aviator Signal
    function getAviatorSignal() {
      let plane = document.getElementById('planeIcon');
      let coef = document.getElementById('coefText');
      plane.style.transform = 'translate(0px, 0px) scale(1)';
      coef.innerHTML = "Qidirilmoqda...";
      
      setTimeout(() => {
        let val = (Math.random() * (5.5 - 1.3) + 1.3).toFixed(2);
        plane.style.transform = 'translate(30px, -20px) scale(1.2)';
        coef.innerHTML = 'x' + val;
      }, 600);
    }

    // Apple logic with Step-by-Step
    let currentAppleRow = -1;
    let applePattern = [];

    function startAppleGame() {
      // Clear board
      document.querySelectorAll('#appleRows .cell').forEach(c => { c.classList.remove('opened'); c.innerHTML = ''; });
      document.querySelectorAll('.mult-item').forEach(m => m.classList.remove('active-mult'));

      // Generate random positions for all 6 rows
      applePattern = [];
      for(let r=0; r<6; r++) {
        applePattern.push(Math.floor(Math.random() * 5));
      }

      currentAppleRow = 0;
      showAppleRow(currentAppleRow);
      
      document.getElementById('prevBtn').disabled = true;
      document.getElementById('nextBtn').disabled = false;
    }

    function stepApple(direction) {
      let newRow = currentAppleRow + direction;
      if (newRow >= 0 && newRow < 6) {
        currentAppleRow = newRow;
        showAppleRow(currentAppleRow);
      }

      document.getElementById('prevBtn').disabled = (currentAppleRow <= 0);
      document.getElementById('nextBtn').disabled = (currentAppleRow >= 5);
    }

    function showAppleRow(rowIdx) {
      // Clear higher rows if going back
      for(let r=0; r<6; r++) {
        let mult = document.getElementById(`m-${r}`);
        if(r <= rowIdx) {
          mult.classList.add('active-mult');
          let col = applePattern[r];
          let el = document.getElementById(`ap-${r}-${col}`);
          el.classList.add('opened');
          el.innerHTML = '🍎';
        } else {
          mult.classList.remove('active-mult');
          for(let c=0; c<5; c++) {
            let el = document.getElementById(`ap-${r}-${c}`);
            el.classList.remove('opened');
            el.innerHTML = '';
          }
        }
      }
    }
  </script>
</body>
</html>
