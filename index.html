<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>4vs4 Shooter Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; justify-content: center; }
    
    .header { width: 100%; max-width: 400px; padding: 10px; display: flex; justify-content: space-between; background: #1e293b; font-size: 14px; font-weight: bold; }
    
    canvas { background: #1e293b; border: 2px solid #334155; border-radius: 10px; touch-action: none; }

    .controls { width: 100%; max-width: 400px; padding: 10px; display: flex; gap: 10px; flex-direction: column; }
    .weapons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
    .w-btn { background: #334155; border: 1px solid #475569; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .w-btn.active { background: #3b82f6; border-color: #60a5fa; }

    .fire-btn { background: linear-gradient(135deg, #ef4444, #dc2626); border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); text-align: center; }
    .fire-btn:active { transform: scale(0.96); }

    .status-overlay { position: absolute; background: rgba(0,0,0,0.85); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="overlay" class="status-overlay" style="display:none;">
    <div id="statusText" style="margin-bottom:15px;">1-RAUND</div>
    <button onclick="nextRound()" style="padding:10px 20px; background:#10b981; border:none; color:#fff; border-radius:8px; font-weight:bold;">DAVOM ETISH 🚀</button>
  </div>

  <div class="header">
    <div style="color:#60a5fa;">SIZ (KOK): <span id="blueScore">0</span></div>
    <div style="color:#f87171;">ROUND: <span id="roundNum">1</span>/3</div>
    <div style="color:#f87171;">DUSHMAN (QIZIL): <span id="redScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="360" height="360"></canvas>

  <div class="controls">
    <div class="weapons">
      <button class="w-btn active" onclick="setWeapon('AK47', this)">AK-47</button>
      <button class="w-btn" onclick="setWeapon('M416', this)">M416</button>
      <button class="w-btn" onclick="setWeapon('AWM', this)">AWM</button>
      <button class="w-btn" onclick="setWeapon('UMP45', this)">UMP-45</button>
      <button class="w-btn" onclick="setWeapon('S12K', this)">S12K</button>
    </div>
    <button class="fire-btn" id="fireBtn">OTISH 💥</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentRound = 1;
    let blueScore = 0;
    let redScore = 0;
    let isGameOver = false;

    // QUROLLAR
    const WEAPONS = {
      'AK47': { damage: 35, rate: 200, speed: 8 },
      'M416': { damage: 25, rate: 120, speed: 10 },
      'AWM': { damage: 100, rate: 800, speed: 14 },
      'UMP45': { damage: 20, rate: 90, speed: 9 },
      'S12K': { damage: 60, rate: 400, speed: 7 }
    };
    let currentWeapon = WEAPONS['AK47'];

    let players = [];
    let bullets = [];

    function initRound() {
      bullets = [];
      players = [];
      
      // KOK JAMOA (Siz + 3 bot)
      players.push({ id: 0, x: 50, y: 180, team: 'blue', hp: 100, isUser: true });
      for(let i=1; i<=3; i++) {
        players.push({ id: i, x: 30, y: 50 + i*80, team: 'blue', hp: 100, isUser: false });
      }

      // QIZIL JAMOA (4 bot)
      for(let i=0; i<4; i++) {
        players.push({ id: i+4, x: 330, y: 50 + i*80, team: 'red', hp: 100, isUser: false });
      }

      document.getElementById('overlay').style.display = 'none';
      isGameOver = false;
    }

    // YURISH (Touch dragging)
    let isDragging = false;
    canvas.addEventListener('touchstart', (e) => isDragging = true);
    canvas.addEventListener('touchend', () => isDragging = false);
    canvas.addEventListener('touchmove', (e) => {
      if(!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const user = players.find(p => p.isUser && p.hp > 0);
      if(user) {
        user.x = touch.clientX - rect.left;
        user.y = touch.clientY - rect.top;
      }
    });

    // OTISH
    document.getElementById('fireBtn').addEventListener('click', () => {
      const user = players.find(p => p.isUser && p.hp > 0);
      if(user) shoot(user, currentWeapon);
    });

    function shoot(p, weapon) {
      // Eng yaqin dushmanni topish
      let enemies = players.filter(e => e.team !== p.team && e.hp > 0);
      if(enemies.length === 0) return;

      let target = enemies[0];
      let minDist = 9999;
      enemies.forEach(e => {
        let d = Math.hypot(e.x - p.x, e.y - p.y);
        if(d < minDist) { minDist = d; target = e; }
      });

      let angle = Math.atan2(target.y - p.y, target.x - p.x);
      bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(angle) * weapon.speed,
        vy: Math.sin(angle) * weapon.speed,
        damage: weapon.damage,
        team: p.team
      });
    }

    function setWeapon(name, btn) {
      currentWeapon = WEAPONS[name];
      document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // BOT AI (Avto-harakat va otish)
    setInterval(() => {
      if(isGameOver) return;
      players.forEach(p => {
        if(!p.isUser && p.hp > 0) {
          // Kichik tasodifiy harakat
          p.x += (Math.random() - 0.5) * 10;
          p.y += (Math.random() - 0.5) * 10;

          // Bot otishi
          if(Math.random() < 0.4) {
            shoot(p, WEAPONS['M416']);
          }
        }
      });
    }, 500);

    // GAME LOOP
    function update() {
      if(isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // O'QLARNI HISOBLASH
      bullets.forEach((b, bIdx) => {
        b.x += b.vx;
        b.y += b.vy;

        // Chizish
        ctx.fillStyle = b.team === 'blue' ? '#60a5fa' : '#f87171';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
        ctx.fill();

        // Tegishni tekshirish
        players.forEach(p => {
          if(p.hp > 0 && p.team !== b.team) {
            let dist = Math.hypot(p.x - b.x, p.y - b.y);
            if(dist < 12) {
              p.hp -= b.damage;
              bullets.splice(bIdx, 1);
            }
          }
        });
      });

      // O'YINCHILARNI CHIZISH
      let blueAlive = 0;
      let redAlive = 0;

      players.forEach(p => {
        if(p.hp > 0) {
          if(p.team === 'blue') blueAlive++;
          else redAlive++;

          // O'yinchi tanasi
          ctx.fillStyle = p.team === 'blue' ? '#2563eb' : '#dc2626';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
          ctx.fill();

          if(p.isUser) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // HP BAR
          ctx.fillStyle = '#000';
          ctx.fillRect(p.x - 12, p.y - 18, 24, 4);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(p.x - 12, p.y - 18, (p.hp/100)*24, 4);
        }
      });

      // RAUND TUGASHINI TEKSHIRISH
      if(blueAlive === 0 || redAlive === 0) {
        isGameOver = true;
        if(blueAlive > 0) blueScore++;
        else redScore++;

        document.getElementById('blueScore').innerText = blueScore;
        document.getElementById('redScore').innerText = redScore;

        const overlay = document.getElementById('overlay');
        const statusText = document.getElementById('statusText');

        if(currentRound >= 3 || blueScore === 2 || redScore === 2) {
          statusText.innerText = blueScore > redScore ? "O'YINDA YUTDINGIZ! 🎉" : "YUTQAZDINGIZ! ❌";
        } else {
          statusText.innerText = `${currentRound}-RAUND TUGADI!`;
        }
        overlay.style.display = 'flex';
      }

      requestAnimationFrame(update);
    }

    function nextRound() {
      if(currentRound >= 3 || blueScore === 2 || redScore === 2) {
        currentRound = 1;
        blueScore = 0;
        redScore = 0;
        document.getElementById('blueScore').innerText = 0;
        document.getElementById('redScore').innerText = 0;
      } else {
        currentRound++;
      }
      document.getElementById('roundNum').innerText = currentRound;
      initRound();
      update();
    }

    initRound();
    update();
  </script>
</body>
</html>
